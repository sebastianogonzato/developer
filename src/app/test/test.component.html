<div>
    <div class="contact-form-wrapper d-flex justify-content-center">
      <form 
      [formGroup]="angFormEmail"
      (ngSubmit)="invioEmail(angFormEmail)" class="contact-form">

        <h5 class="title">Contact us</h5>
        <p class="description">Lets talk about everything!
        </p>
        <div>
          <input type="text" formControlName="nome" class="form-control rounded border-white mb-3 form-input"  name="name" placeholder="Name" required>
        </div>
        <div>
          <input type="email" class="form-control rounded border-white mb-3 form-input"  name="email" placeholder="Email" required>
        </div>
        <div>
          <textarea class="form-control rounded border-white mb-3 form-text-area"  name="message" rows="5" cols="30" placeholder="Message" required></textarea>
        </div>
        <!-- <div class="submit-button-wrapper">
          <button type="submit">Send</button>
        </div> -->

        <div class="form-group form-button">
          <input type="submit" [disabled]="!angFormEmail.valid" name="signup" id="signup" class="form-submit" value="Salva"/>
      </div>

      </form>
    </div> 
  </div>
